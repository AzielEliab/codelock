[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codelock"
version = "0.1.0"
description = "Gate-tethered cognitive rendering: reversible view-layer transforms of identical source text (CodeLock, July 2026). Not encryption."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Aziel Eliab"}]
requires-python = ">=3.10"
keywords = [
    "rendering",
    "cognition",
    "view-layer",
    "rosetta",
    "perception",
    "source",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
codelock = "codelock.cli:main"

[project.urls]
Homepage = "https://github.com/AzielEliab/codelock"
Download = "https://github.com/AzielEliab/codelock/releases"
Issues = "https://github.com/AzielEliab/codelock/issues"

[tool.setuptools.packages.find]
include = ["codelock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
